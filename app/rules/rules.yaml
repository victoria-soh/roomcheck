    could_mean: "A camera that appeared after you moved in could record you without you knowing."
    next_step: Find it physically, then say where it is. It wasn't there at your move-in scan.
    next_step_by_stay:
      short_stay: >-
        Find it physically, then say where it is. Many platforms don't allow indoor cameras.
      rental: >-
        Find it physically, then say where it is. It wasn't there when you moved in, so check
