# Layer 3 and Layer 4 rules, judged by app/rules/engine.py (pure functions, no I/O).
#
# Each rule:
#   id              rule ID from docs/original-plan.md
#   scope           device (one finding per matching device), network (at most one finding),
#                   or nearby (Layer 4: one finding per flagged access point or Bluetooth device)
#   when            exactly one named predicate from engine.PREDICATES, with its arguments
#   severity        a severity, or a map from the predicate's variant to a severity
#   title / next_step  text, or a map by variant
#   observed        one plain sentence saying what was seen, true whenever the rule fires.
#                   The Results screen's summary and short cards use it (never AI text).
#   guidance        extra steps shown under the next step
#   evidence_fields device facts added after the predicate's own evidence
#   about_your_network  true for nearby rules about the network you're connected to (its own
#                   router or access point): shown under "This network" on Results, not Nearby
#   next_step_by_stay  next steps for a stay type (short_stay, rental, hostel), chosen on Start;
#                   next_step is the default, for "Other" and anything not listed
#   guidance_by_stay   guidance for a stay type; guidance is the default
#   next_step_by_location  camera rules: next steps once the user says where it is (inside,
#                   outside, unknown), by stay type with "other" as the default, and which
#                   message the card offers (draft: host or platform)
#   question        which of the renter's questions on Results and in the report it answers:
#                   watching, control or wifi (see `questions` below)
#
# Severities and next steps follow docs/original-plan.md. Wording never tells the user a device or room is fine;
# a test checks this file for reassuring words.

cant_see:
  - Cameras that join a hidden or separate network as ordinary clients, or that only record to a memory card and send nothing.
  - Devices on this network that stayed silent for the whole scan.
  - Who owns the account a cloud-linked device is paired to.
  - A device's exact firmware version. That would need logging in to it, which RoomCheck never does.
  - Cameras that join the host's network as ordinary clients broadcast nothing the nearby check can hear.
  - "Network names, makers and tracker formats are unconfirmed: clues, not proof. The locator gives a rough area, not an exact spot."

not_yet_checked: []

# The renter's questions that Results and the report are organised by, in order. `checks` are
# the checks whose results each question's status line depends on: "Not detected by the checks
# that ran" needs at least one of them to have run, and any that didn't are named as Not
# checked. The fourth question, "What's changed since move-in?", comes from Compare, not from
# rules. The wording is in web/src/strings/en.json (results.questions).
questions:
  watching:
    checks: [passive_listen, mdns, arp_sweep, ssdp, onvif, port_check, identity_check, nearby_wifi, bluetooth]
  control:
    checks: [passive_listen, mdns, arp_sweep, ssdp, vendor_lookup, port_check, identity_check, cve]
  wifi:
    checks: [wifi_encryption, dns, arp, dhcp, upnp, nearby_wifi, lookalike, wps]

rules:
  - id: R-CAM
    scope: device
    question: watching
    when: {type_score: {type: camera, min: 0.5}}
    severity: {Likely: High, Possible: Medium}
    title: {Likely: Likely camera, Possible: Possible camera}
    observed: "A device on this network gave camera-like clues, such as how it answers on the network."
    could_mean: "If it is a camera where you stay, it could record you, and someone could watch what it records."
    next_step: Find it physically, then say where it is.
    next_step_by_stay:
      short_stay: Find it physically, then say where it is. Many platforms don't allow indoor cameras.
      rental: >-
        Find it physically, then say where it is. Your tenancy agreement may say whether cameras
        are allowed.
      hostel: Find it physically, then say where it is.
    # After "Where is it?" (Results, Do you recognise this device?): next steps by the answer
    # and the stay type. draft: which message the card offers, to the host (the default) or a
    # report to the platform.
    next_step_by_location:
      inside:
        short_stay:
          step: Many platforms don't allow indoor cameras. Report it to the platform and keep your evidence.
          draft: platform
        rental:
          step: >-
            Check what your tenancy agreement says about cameras, and ask the host in writing
            why it's there, who can view it, and to remove it or switch it off. Keep your evidence.
        hostel:
          step: Report it to the front desk or management, and keep your evidence.
        other:
          step: Ask the host why it's there and who can view it, and keep your evidence.
      outside:
        short_stay:
          step: >-
            Check the listing for a disclosed camera. If it isn't disclosed, ask the host what
            it records and who can view it.
        rental:
          step: >-
            Check your tenancy agreement for a disclosed camera. If it isn't disclosed, ask the
            host what it records and who can view it.
        hostel:
          step: >-
            Ask the front desk or management whether the camera is disclosed, what it records and
            who can view it.
        other:
          step: >-
            Check the listing or tenancy agreement for a disclosed camera. If it isn't disclosed,
            ask the host what it records and who can view it.
      unknown:
        hostel:
          step: Ask the front desk or management what it is, where it is and who can view it.
        other:
          step: Ask the host what it is, where it is and who can view it.
    # Who to report a hidden camera to depends on where you're staying (Start).
    guidance:
      - "Don't touch or unplug it. Photograph it where it is."
      - Leave if you feel unsafe.
      - Report it to the host and the police.
      - "Laws differ by country. This isn't legal advice."
    guidance_by_stay:
      short_stay:
        - "Don't touch or unplug it. Photograph it where it is."
        - Leave if you feel unsafe.
        - Report it to the platform and the police.
        - "Laws differ by country. This isn't legal advice."
      rental:
        - "Don't touch or unplug it. Photograph it where it is."
        - Leave if you feel unsafe.
        - Report it to the host or the landlord's agent, and the police.
        - "Laws differ by country. This isn't legal advice."
      hostel:
        - "Don't touch or unplug it. Photograph it where it is."
        - Leave if you feel unsafe.
        - Report it to the management and the police.
        - "Laws differ by country. This isn't legal advice."
    evidence_fields: [maker, address, open_ports, notes, identification]
    explanation: "A device on this network looks like a camera. It answers on the network the way cameras do, so it needs a closer look."
    why_it_matters: "RoomCheck can't tell where the device is. If it is a camera where you stay, it could record you. You have a right to know where it is and who can watch it."
    landlord_question: "I noticed a device on the Wi-Fi that looks like a camera. Could you tell me where it is, what it records and who can view it?"

