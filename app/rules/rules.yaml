        hostel:
          step: Report it to the front desk or management, and keep your evidence.
        other:
          step: Ask the host what it is and who can view it, and keep your evidence.
      outside:
        short_stay:
          step: >-
            Check the listing for a disclosed camera. If it isn't disclosed, ask the host what
            it records and who can view it.
        rental:
          step: >-
            Check your tenancy agreement for a disclosed camera. If it isn't disclosed, ask the
            host what it records and who can view it.
        hostel:
          step: >-
            Ask the front desk or management whether the camera is disclosed, what it records and
            who can view it.
        other:
          step: >-
            Check the listing or tenancy agreement for a disclosed camera. If it isn't disclosed,
            ask the host what it records and who can view it.
      unknown:
        hostel:
          step: Ask the front desk or management what it is, where it is and who can view it.
        other:
          step: Ask the host what it is, where it is and who can view it.
    # Who to report a hidden camera to depends on where you're staying (Start).
    guidance:
      - "Don't touch or unplug it. Photograph it where it is."
      - Leave if you feel unsafe.
      - Report it to the host and the police.
      - "Laws differ by country. This isn't legal advice."
    guidance_by_stay:
      short_stay:
        - "Don't touch or unplug it. Photograph it where it is."
        - Leave if you feel unsafe.
        - Report it to the platform and the police.
        - "Laws differ by country. This isn't legal advice."
      rental:
        - "Don't touch or unplug it. Photograph it where it is."
        - Leave if you feel unsafe.
        - Report it to the host or the landlord's agent, and the police.
