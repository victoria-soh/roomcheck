# Layer 6 handover tasks: one per High or Medium finding, from fixed templates. Nothing here is
# written by AI, and there are no brand-specific reset steps: for those, a task links to the
# maker's own support page (support_pages below).
#
# Each template:
#   category  camera | lock | cloud | router | device_service | tracker (the steps below)
#   title     what the task is, in plain words
#   ask       the question for the message to the host; always a question
#   who       landlord_or_host | booking_platform | you
#   steps     extra steps for this rule, after the category's steps
#   optional  suggestions the finding doesn't require, each with its own one-line reason;
#             shown apart from the steps and never added to the message
#
# Every step and question asks only for what its own finding supports: nothing bundled.

categories:
  camera:
    steps:
      - Ask where it is, what it records and who can view it.
      - Ask for the answer in writing, so you have a record.
  lock:
    steps:
      - Ask for previous users, codes and fingerprints to be removed.
      - Ask for confirmation in writing when it's done.
  cloud:
    steps:
      - Ask for other people's accounts to be removed from it, or for it to be factory-reset and set up again on your own account.
  router:
    steps: []
  device_service:
    steps:
      - Ask whether the device can be updated, or the service turned off.
  tracker:
    steps:
      - Find it with the locator on the Nearby page.
      - A phone's built-in unknown-tracker alert can give a second opinion.
      - If you don't recognise it and you're worried, contact the booking platform or the police.

templates:
  R-CAM:
    category: camera
    title: Ask about the device that looks like a camera
    ask: Could you tell me what the device on the Wi-Fi that looks like a camera is, where it is, what it records and who can view it?
    who: landlord_or_host
  R-NEW-CAMERA:
    category: camera
    title: Ask about the camera-like device that appeared since you moved in
    ask: A device that looks like a camera has joined the Wi-Fi since I moved in. Could you tell me what it is, where it is and who can view it?
    who: landlord_or_host
  R-CAMHOT:
    category: camera
    title: Ask about the camera setup hotspot nearby
    ask: I noticed a Wi-Fi network nearby that looks like a camera's setup network. Is there a camera in or near the flat, and who can view it?
    who: landlord_or_host
  R-LOCK:
    category: lock
    title: Ask for the smart lock or doorbell to be cleared
    ask: Could you remove previous users and codes from the smart lock or doorbell, and confirm in writing when that's done?
    who: landlord_or_host
  R-CLOUD:
    category: cloud
    title: Ask who else can use the cloud-linked device
    ask: Could you tell me whose account the smart device on the Wi-Fi is linked to, and remove other accounts from it?
    who: landlord_or_host
  R-TELNET:
    category: device_service
    title: Ask about the device that offers Telnet
    ask: One device on the Wi-Fi accepts old, unencrypted remote logins (Telnet). Could you check whether it can be updated or that feature turned off?
    who: landlord_or_host
  R-CVE:
    category: device_service
    title: Ask whether the device with known issues is up to date
    ask: Known security issues have been reported for one device model on the Wi-Fi. Could you check whether its software is up to date?
    who: landlord_or_host
  R-WIFI-ENC:
    category: router
    title: Ask for the Wi-Fi to be properly encrypted
    ask: This Wi-Fi connection uses no encryption, or old WEP encryption. Could you switch it to WPA2 or WPA3?
    who: landlord_or_host
    steps:
      - Ask for the Wi-Fi to use WPA2 or WPA3, the modern kinds of Wi-Fi encryption.
    optional:
      - text: You could also ask for a new Wi-Fi password once it's switched.
        reason: Without modern encryption, people nearby could have seen the old one.
  R-UPNP:
    category: router
    title: Ask about the router letting devices open internet ports
    ask: The router advertises UPnP, which can let devices open connections from the internet by themselves. Could you check whether that can be turned off?
    who: landlord_or_host
  R-DNS:
    category: router
    title: Ask about the router's address lookups
    ask: Web address lookups on the Wi-Fi gave unexpected answers. Could you check the router's settings, or ask the internet provider?
    who: landlord_or_host
  R-ARP:
    category: router
    title: Ask about the device answering for the router
    ask: More than one device on the Wi-Fi seems to answer for the router. Could you check what devices are connected to it?
    who: landlord_or_host
  R-DHCP:
    category: router
    title: Ask about the second device handing out addresses
    ask: More than one device on the Wi-Fi offered to hand out network addresses. Could you check whether there's a second router connected?
    who: landlord_or_host
  R-WPS:
    category: router
    title: Ask for WPS to be turned off on the router
    ask: The Wi-Fi router advertises WPS. Could you turn it off in the router's settings?
    who: landlord_or_host
    steps:
      - Ask for WPS, a quick way to join the Wi-Fi with a button or a short code, to be turned off.
  R-TWIN:
    category: router
    title: Ask about the copy of your Wi-Fi network name
    ask: I noticed another Wi-Fi network nearby with the same name as this Wi-Fi, but weaker security. Is it one of your networks?
    who: landlord_or_host
  R-TWIN-VENDOR:
    category: router
    title: Ask about the possible lookalike of your Wi-Fi
    ask: I noticed a Wi-Fi network nearby with the same name as this Wi-Fi from a different maker. Is it one of your networks?
    who: landlord_or_host
  R-TWIN-DOWNGRADE:
    category: router
    title: Ask about the possible downgrade lookalike of your Wi-Fi
    ask: I noticed a Wi-Fi network nearby with the same name as this Wi-Fi but older security. Is it one of your networks?
    who: landlord_or_host
  R-TRACKER:
    category: tracker
    title: Check the item tracker nearby
    ask: An item tracker I don't recognise keeps showing up nearby. Do you know anything about it?
    who: you

# Shown instead of the rule's next step when you say a device is yours. The finding itself, its
# evidence and severity, stay as they are.
recognition:
  mine_next_step: You said this is yours, so there's nothing to ask the host about it. Check it's set up the way you want, with up-to-date software and your own account.

# The maker's own support pages, matched against the device's or nearby item's maker name.
# Only these links are ever shown; RoomCheck never writes reset steps itself.
support_pages:
  - match: tp-link
    name: TP-Link support
    url: https://www.tp-link.com/support/
  - match: hikvision
    name: Hikvision support
    url: https://www.hikvision.com/en/support/
  - match: google
    name: Google Nest Help
    url: https://support.google.com/googlenest/
  - match: ring
    name: Ring Help
    url: https://support.ring.com/
  - match: sonos
    name: Sonos support
    url: https://support.sonos.com/
  - match: philips
    name: Philips Hue support
    url: https://www.philips-hue.com/support
  - match: xiaomi
    name: Xiaomi support
    url: https://www.mi.com/global/support/
